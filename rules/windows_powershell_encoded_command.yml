title: PowerShell Encoded Command Execution
id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
status: test
description: Detects PowerShell encoded command execution via all known flag variants (-EncodedCommand, -e, -enc, -en, -encoded) including case evasion and spacing tricks.
author: Himanshu Jha
date: 2026-09-25
logsource:
  product: windows
  category: process_creation
detection:
  selection_powershell:
    Image|endswith: '\powershell.exe'
  selection_encoded_flags:
    CommandLine|contains|all:
      - '-EncodedCommand'
      - '-Encoded Command'
      - '-Enc'
      - '-En '
      - '-Encoded'
      - '-e '
  selection_case_evasion:
    CommandLine|re: '(?i)-(encodedcommand|enc(oded?)?|en)\s+'
  selection_base64:
    CommandLine|re: '[A-Za-z0-9+/]{20,}={0,2}'
  condition: selection_powershell and (selection_encoded_flags or selection_case_evasion) and selection_base64
falsepositives:
  - Legitimate administrative scripts using encoded commands for deployment
  - Azure/DevOps pipeline scripts
  - Automated system management tools
level: high
tags:
  - attack.execution
  - attack.t1059.001